[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "lumen-data"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["numpy==2.2.6", "opencv-python-headless==4.12.0.88", "PyYAML==6.0.3", "Pillow==12.0.0", "pyarrow==22.0.0", "html5lib==1.1"]

[project.optional-dependencies]
corpus = ["fsspec[http]==2026.9.0"]

[project.scripts]
lumen-data = "lumen_data.cli:main"

[dependency-groups]
dev = ["pytest==8.4.2", "ruff==0.14.4"]

[tool.hatch.build.targets.wheel]
packages = ["python/lumen_data"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
pythonpath = ["python"]

[tool.ruff]
line-length = 100
target-version = "py311"
